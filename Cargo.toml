[workspace]
members = ["crates/hearth-core", "crates/hearth-cli", "crates/hearth-helper", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Wolfgang Linz"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
