[workspace]
members = ["crates/stoke-core", "crates/stoke-cli", "crates/stoke-helper", "src-tauri"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Wolfgang Linz"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
