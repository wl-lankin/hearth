[package]
name = "hearth-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hearth-core = { path = "../hearth-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }
widestring = "1"

[dev-dependencies]
tempfile = "3"
