name: release

# A tag v<version> builds Hearth for Windows (NSIS installer) and macOS (universal .dmg) and
# attaches them to a DRAFT GitHub release, together with latest.json, the feed installed copies
# of Hearth update from. Installed copies see the update once the draft is published by hand
# (see docs/RELEASE.md). The notes are the CHANGELOG.md section of the version, else the tag
# message. A tag with a hyphen (v1.1.0-beta.1) becomes a prerelease.
#
# Every installer is attached twice: with the version in the name (tauri-action) and under a
# fixed name (Hearth-Windows-Setup.exe, Hearth-macOS.dmg), so a link to
# releases/latest/download/<fixed name> always serves the newest one.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The notes fall back to the tag message, which a shallow checkout lacks.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: The tag matches every version file
        env:
          TAG: ${{ github.ref_name }}
        # The files carry the plain version: v1.1.0-beta.1 checks 1.1.0.
        run: |
          version="${TAG#v}"
          node scripts/check-version.mjs "${version%%-*}"
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          # The create call answers with the id; listing releases right after can miss a fresh draft.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="Hearth $TAG" \
            -F body=@"$RUNNER_TEMP/notes.md" -F draft=true -F prerelease="$prerelease" --jq .id)
          if [ -z "$id" ]; then echo "::error::Could not create the draft release"; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      # One platform at a time: both upload to the same latest.json, which must not race.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis --config src-tauri/tauri.release.conf.json'
            targets: ''
          - os: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - name: The draft release is known
        if: needs.draft.outputs.release_id == ''
        run: |
          echo "::error::The draft job passed no release id; nothing would be uploaded."
          exit 1
      # The `hearth` CLI ships inside the app (tauri.release.conf.json bundles it as hearth-cli,
      # since the app itself is Hearth); the app copies it into <home>/bin on start.
      - name: Build the CLI for the bundle
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --release -p hearth-cli
            cp target/release/hearth.exe src-tauri/binaries/hearth-cli-x86_64-pc-windows-msvc.exe
          else
            cargo build --release -p hearth-cli --target aarch64-apple-darwin
            cargo build --release -p hearth-cli --target x86_64-apple-darwin
            lipo -create -output src-tauri/binaries/hearth-cli-universal-apple-darwin \
              target/aarch64-apple-darwin/release/hearth target/x86_64-apple-darwin/release/hearth
            # A universal build compiles each architecture on its own first, and each looks for
            # its own copy of the CLI.
            for arch in aarch64 x86_64; do
              cp "target/$arch-apple-darwin/release/hearth" "src-tauri/binaries/hearth-cli-$arch-apple-darwin"
            done
          fi
          ls -l src-tauri/binaries
      # Code signing (Azure Trusted Signing, Apple notarization) is added in M14, once the
      # certificates exist. Until then only the update packages are signed.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; installed copies of Hearth accept only updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}
          # latest.json is the feed the in-app updater reads (releases/latest/download/latest.json).
          includeUpdaterJson: true

  stable-names:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Installers under fixed names
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release stays a draft: it is checked and published by hand (docs/RELEASE.md).
          version="${TAG#v}"
          version="${version%%-*}"
          mkdir stable && cd stable
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Hearth_${version}_x64-setup.exe" --pattern "Hearth_${version}_universal.dmg"
          mv "Hearth_${version}_x64-setup.exe" Hearth-Windows-Setup.exe
          mv "Hearth_${version}_universal.dmg" Hearth-macOS.dmg
          ls -l
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber Hearth-Windows-Setup.exe Hearth-macOS.dmg
