# Builds and signs the Windows installer without releasing anything, then checks the signatures
# of the installer and of every .exe inside it. Runs on pull requests that touch the signing setup,
# or by hand. The installer is kept as a workflow artifact.

name: Windows signing check

on:
  pull_request:
    paths:
      - .github/actions/windows-signing/**
      - .github/workflows/windows-signing-check.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: windows-latest
    environment: release
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci

      - name: Build the CLI for the bundle
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cargo build --release -p hearth-cli
          cp target/release/hearth.exe src-tauri/binaries/hearth-cli-x86_64-pc-windows-msvc.exe

      # The app, the hearth-cli sidecar (externalBin) and the installer are signed inside tauri
      # build.
      - name: Prepare code signing
        id: signing
        uses: ./.github/actions/windows-signing
        with:
          description: Hearth

      # createUpdaterArtifacts is on in tauri.conf.json and would demand the updater key.
      - name: Build and sign
        shell: bash
        run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json --config '{"bundle":{"createUpdaterArtifacts":false}}' --config "${{ steps.signing.outputs.config }}"

      - name: Check the signatures
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe
          $unpacked = Join-Path $env:RUNNER_TEMP 'installer'
          7z x $setup.FullName "-o$unpacked" -y | Out-Null
          $files = @($setup) + @(Get-ChildItem $unpacked -Recurse -Filter *.exe | Where-Object Name -notlike 'uninstall*')
          foreach ($n in 'hearth-app.exe', 'hearth-cli.exe') {
            if (-not ($files.Name -ccontains $n)) { throw "$n missing in the installer: $($files.Name -join ', ')" }
          }
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} | {2} | timestamp: {3}" -f $f.Name, $s.Status, $s.SignerCertificate.Subject, ($null -ne $s.TimeStamperCertificate)
            if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'CN=Wolfgang Linz' -or -not $s.TimeStamperCertificate) { $bad++ }
          }
          if ($bad) { throw "$bad file(s) not signed correctly" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearth-windows-signed
          path: target/release/bundle/nsis/*-setup.exe
          retention-days: 7
